name: Experiment 03 stationary FDT wavelength

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/stationary_fdt_wavelength_screen.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/history_fdt_reformation_margin.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/initial_quantum_tangent_scan.py'
      - '.github/workflows/experiment03-stationary-fdt-wavelength.yml'

jobs:
  wavelength:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Run stationary-history FDT wavelength screen
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python stationary_fdt_wavelength_screen.py
