name: Experiment 03 direct-port bath correlation

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/direct_port_bath_correlation.py'
      - '.github/workflows/experiment03-direct-port-correlation.yml'
  workflow_dispatch:

jobs:
  correlation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python direct_port_bath_correlation.py
