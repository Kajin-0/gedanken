name: Experiment 03 reaction-coordinate UV cutoff gate

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/reaction_coordinate_uv_cutoff_gate.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/two_pole_joint_covariance.py'
      - '.github/workflows/experiment03-reaction-coordinate-uv.yml'
  workflow_dispatch:

jobs:
  uv-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python reaction_coordinate_uv_cutoff_gate.py
