name: Experiment 03 safe-tilt CRN comparison

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/safe_tilt_crn_compare.py'
      - '.github/workflows/experiment03-safe-tilt-crn.yml'
  workflow_dispatch:

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        delta: ['0.21200','0.21225','0.21250','0.21275','0.21300']
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python safe_tilt_crn_compare.py --delta ${{ matrix.delta }}
