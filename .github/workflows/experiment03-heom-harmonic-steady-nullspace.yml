name: Experiment 03 harmonic HEOM steady-nullspace probe

on:
  push:
    branches: [main]
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/heom_harmonic_steady_nullspace_probe.py'
      - '.github/workflows/experiment03-heom-harmonic-steady-nullspace.yml'
  workflow_dispatch:

jobs:
  steady-nullspace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [p4d3, p4d4, p4d5]
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python heom_harmonic_steady_nullspace_probe.py --case '${{ matrix.case }}'
