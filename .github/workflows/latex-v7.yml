name: Compile V7 manuscript

on:
  push:
    paths:
      - 'experiments/01-causal-quantum-branch-information/manuscript_v7/**'
      - '.github/workflows/latex-v7.yml'
  pull_request:
    paths:
      - 'experiments/01-causal-quantum-branch-information/manuscript_v7/**'
      - '.github/workflows/latex-v7.yml'

jobs:
  latex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-science texlive-bibtex-extra
      - name: Compile manuscript
        working-directory: experiments/01-causal-quantum-branch-information/manuscript_v7
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Check for unresolved references
        working-directory: experiments/01-causal-quantum-branch-information/manuscript_v7
        run: |
          if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations" main.log; then
            echo "Unresolved LaTeX references or citations found."
            exit 1
          fi
      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-v7-pdf
          path: experiments/01-causal-quantum-branch-information/manuscript_v7/main.pdf
          if-no-files-found: error
