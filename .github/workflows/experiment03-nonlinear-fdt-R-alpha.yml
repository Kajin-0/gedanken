name: Experiment 03 nonlinear FDT R-alpha scan

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/nonlinear_fdt_R_alpha_scan.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/nonlinear_fdt_twa_screen.py'
      - '.github/workflows/experiment03-nonlinear-fdt-R-alpha.yml'

jobs:
  Rscan:
    strategy:
      fail-fast: false
      matrix:
        R: ['150','200','250','300','400','500']
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Run nonlinear causal R-alpha scan
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python nonlinear_fdt_R_alpha_scan.py --R ${{ matrix.R }} --ntraj 512 --dt-ps 0.5 --seed 86420
