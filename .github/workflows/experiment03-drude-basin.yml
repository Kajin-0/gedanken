name: Experiment 03 Drude propagator basin stress

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/drude_basin_geometry.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/full_dynamic_rfsquid.py'
      - '.github/workflows/experiment03-drude-basin.yml'

jobs:
  basin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python drude_basin_geometry.py
