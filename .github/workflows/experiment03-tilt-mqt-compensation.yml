name: Experiment 03 tilt MQT compensation

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/tilt_mqt_compensation.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/tilt_directionality_pareto.py'
      - '.github/workflows/experiment03-tilt-mqt-compensation.yml'

jobs:
  mqt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Run provisional tilt-MQT compensation
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python tilt_mqt_compensation.py
