name: Experiment 03 same-Y dark bounce

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/sameY_dissipative_bounce_screen.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/causal_two_pole_environment.py'
      - '.github/workflows/experiment03-sameY-dark-bounce.yml'

jobs:
  bounce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Run same-Y dissipative dark-bounce screen
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python sameY_dissipative_bounce_screen.py
