name: Experiment 03 custom Matsubara-tail HEOM control

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/heom_harmonic_tail_terminator.py'
      - '.github/workflows/experiment03-heom-tail-terminator.yml'
  workflow_dispatch:

jobs:
  tail:
    strategy:
      fail-fast: false
      matrix:
        case: [n8d3t, n16d2t, n16d3t]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python heom_harmonic_tail_terminator.py --case ${{ matrix.case }}
