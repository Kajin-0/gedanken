name: Experiment 03 deep Padé HEOM harmonic convergence

on:
  push:
    branches: [main]
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/heom_harmonic_pade_depth.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/direct_port_bath_pade.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/direct_port_bath_correlation.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/heom_harmonic_port_validation.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt'
      - '.github/workflows/experiment03-heom-pade-depth.yml'
  workflow_dispatch:

jobs:
  depth:
    strategy:
      fail-fast: false
      matrix:
        case: [p4d3, p4d4, p4d5, p4d6, p5d5, p6d5, p8d4]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python heom_harmonic_pade_depth.py --case ${{ matrix.case }}
