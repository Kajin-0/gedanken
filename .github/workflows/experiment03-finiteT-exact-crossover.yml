name: Experiment 03 exact finite-T sphaleron crossover

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/finiteT_exact_sphaleron_crossover.py'
      - '.github/workflows/experiment03-finiteT-exact-crossover.yml'

jobs:
  crossover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python finiteT_exact_sphaleron_crossover.py
