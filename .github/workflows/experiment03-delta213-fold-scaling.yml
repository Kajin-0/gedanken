name: Experiment 03 delta213 fold distance

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/delta213_fold_scaling.py'
      - '.github/workflows/experiment03-delta213-fold-scaling.yml'
  workflow_dispatch:

jobs:
  fold:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python delta213_fold_scaling.py
