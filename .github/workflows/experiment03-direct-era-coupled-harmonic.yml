name: Experiment 03 direct ERA coupled harmonic first matrix

on:
  push:
    paths:
      - '.github/workflows/experiment03-direct-era-coupled-harmonic.yml'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/direct_era_coupled_harmonic.py'
  workflow_dispatch:

jobs:
  direct-era:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-heom.txt
      - run: python -m pip install -q 'cvxpy>=1.6,<2'
      - name: Run frozen direct ERA rank matrix
        run: python direct_era_coupled_harmonic.py
