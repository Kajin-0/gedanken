name: Experiment 03 optimized barrier-shape action scan

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/barrier_shape_action_fast.py'
      - '.github/workflows/experiment03-barrier-shape-action-fast.yml'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python barrier_shape_action_fast.py
