name: Experiment 03 delta214 large-branch dark rate

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/large_branch_one_loop_rate_214.py'
      - '.github/workflows/experiment03-delta214-large-branch-rate.yml'
  workflow_dispatch:

jobs:
  rate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python large_branch_one_loop_rate_214.py
