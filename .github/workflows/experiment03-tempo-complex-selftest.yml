name: Experiment 03 TEMPO complex analytic self-test

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/tempo_complex_dephasing_selftest.py'
      - '.github/workflows/experiment03-tempo-complex-selftest.yml'
  workflow_dispatch:

jobs:
  tempo-complex-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python -m pip install oqupy==0.5.0
      - run: python tempo_complex_dephasing_selftest.py
