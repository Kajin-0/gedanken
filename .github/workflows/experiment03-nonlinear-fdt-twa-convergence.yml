name: Experiment 03 nonlinear FDT TWA convergence

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/nonlinear_fdt_twa_convergence.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/nonlinear_fdt_twa_screen.py'
      - '.github/workflows/experiment03-nonlinear-fdt-twa-convergence.yml'

jobs:
  converge:
    strategy:
      fail-fast: false
      matrix:
        dt_ps: ['0.50','0.25']
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Run nonlinear FDT TWA convergence
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python nonlinear_fdt_twa_convergence.py --ntraj 1024 --dt-ps ${{ matrix.dt_ps }} --seed 12345
