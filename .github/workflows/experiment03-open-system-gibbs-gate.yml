name: Experiment 03 exact-FDT versus bare-Gibbs covariance

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/open_system_gibbs_covariance_gate.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/two_pole_joint_covariance.py'
      - '.github/workflows/experiment03-open-system-gibbs-gate.yml'
  workflow_dispatch:

jobs:
  covariance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python open_system_gibbs_covariance_gate.py
