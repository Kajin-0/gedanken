name: Experiment 03 coupled-Lindblad harmonic Gaussian benchmark

on:
  push:
    paths:
      - '.github/workflows/experiment03-coupled-lindblad-harmonic-gaussian.yml'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/coupled_lindblad_harmonic_gaussian.py'
  workflow_dispatch:

jobs:
  harmonic-gaussian:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-heom.txt
      - run: python -m pip install -q 'cvxpy>=1.6,<2'
      - name: Run exact Gaussian harmonic coupled-mode benchmark
        run: python coupled_lindblad_harmonic_gaussian.py
