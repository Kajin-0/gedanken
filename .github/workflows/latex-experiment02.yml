name: Compile Experiment 02 manuscript

on:
  push:
    paths:
      - 'experiments/02-passive-gravitational-throughput/manuscript_v1/**'
      - '.github/workflows/latex-experiment02.yml'
  pull_request:
    paths:
      - 'experiments/02-passive-gravitational-throughput/manuscript_v1/**'
      - '.github/workflows/latex-experiment02.yml'

jobs:
  latex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended

      - name: Compile manuscript
        working-directory: experiments/02-passive-gravitational-throughput/manuscript_v1
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Check unresolved references
        working-directory: experiments/02-passive-gravitational-throughput/manuscript_v1
        run: |
          if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations" main.log; then
            echo "Unresolved references/citations found"
            exit 1
          fi

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: experiment02-manuscript-v1
          path: experiments/02-passive-gravitational-throughput/manuscript_v1/main.pdf
