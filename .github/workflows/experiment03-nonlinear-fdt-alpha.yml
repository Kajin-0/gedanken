name: Experiment 03 nonlinear FDT alpha scan

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/nonlinear_fdt_alpha_scan.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/nonlinear_fdt_twa_screen.py'
      - '.github/workflows/experiment03-nonlinear-fdt-alpha.yml'

jobs:
  alpha:
    strategy:
      fail-fast: false
      matrix:
        alpha: ['0.50','0.60','0.70','0.80']
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Run nonlinear stationary-bath alpha scan
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python nonlinear_fdt_alpha_scan.py --alpha ${{ matrix.alpha }} --ntraj 512 --dt-ps 0.5 --seed 24680
