name: Experiment 03 one-loop high-tilt boundary

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/one_loop_rate_high_tilt_boundary.py'
      - '.github/workflows/experiment03-one-loop-high-tilt-boundary.yml'

jobs:
  boundary:
    strategy:
      fail-fast: false
      matrix:
        delta: ['0.211','0.212','0.213','0.214']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python one_loop_rate_high_tilt_boundary.py --delta ${{ matrix.delta }}
