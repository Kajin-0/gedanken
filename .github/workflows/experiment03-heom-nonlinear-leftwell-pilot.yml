name: Experiment 03 nonlinear left-well HEOM pilot

on:
  push:
    branches: [main]
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/heom_nonlinear_leftwell_pilot.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/phase_dvr_basis_convergence.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/heom_harmonic_pade_depth.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/direct_port_bath_pade.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt'
      - '.github/workflows/experiment03-heom-nonlinear-leftwell-pilot.yml'
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case:
          - large_dim8_p4d4
          - large_dim8_p4d5
          - large_dim8_p5d5
          - large_dim10_p4d5
          - medium_dim8_p4d5
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python heom_nonlinear_leftwell_pilot.py --case '${{ matrix.case }}'
