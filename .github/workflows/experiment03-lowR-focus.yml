name: Experiment 03 focused low-R nonlinear FDT

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/nonlinear_fdt_lowR_focus.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/nonlinear_fdt_twa_screen.py'
      - '.github/workflows/experiment03-lowR-focus.yml'

jobs:
  lowR:
    strategy:
      fail-fast: false
      matrix:
        R: ['80','100','120','130','140','150']
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Run focused low-R scan
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python nonlinear_fdt_lowR_focus.py --R ${{ matrix.R }} --ntraj 1024 --dt-ps 0.5 --seed 515151
