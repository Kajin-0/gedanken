name: Experiment 03 correlated Drude optimum refinement

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/drude_correlated_optimum_refine.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/drude_correlated_capture.py'
      - '.github/workflows/experiment03-drude-correlated-optimum.yml'

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python drude_correlated_optimum_refine.py
