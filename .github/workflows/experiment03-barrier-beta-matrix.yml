name: Experiment 03 barrier-shape beta matrix

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/barrier_shape_beta_worker.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/barrier_shape_action_fast.py'
      - '.github/workflows/experiment03-barrier-beta-matrix.yml'

jobs:
  beta:
    strategy:
      fail-fast: false
      matrix:
        beta: ['0.80','0.85','0.90','0.95','1.00']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python barrier_shape_beta_worker.py --beta ${{ matrix.beta }}
