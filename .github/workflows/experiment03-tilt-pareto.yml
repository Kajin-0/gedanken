name: Experiment 03 tilt Pareto

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/tilt_directionality_pareto.py'
      - '.github/workflows/experiment03-tilt-pareto.yml'

jobs:
  tilt:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Run tilt directionality/dark Pareto
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python tilt_directionality_pareto.py
