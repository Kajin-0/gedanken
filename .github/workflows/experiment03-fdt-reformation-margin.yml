name: Experiment 03 FDT reformation margin

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/linearized_fdt_reformation_margin.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/directional_recovery_barriers.py'
      - '.github/workflows/experiment03-fdt-reformation-margin.yml'

jobs:
  margin:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Run linearized FDT reformation-margin diagnostic
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python linearized_fdt_reformation_margin.py
