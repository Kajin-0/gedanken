name: Experiment 03 finite-T periodic nonlocal bounce v2

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/finiteT_nonlocal_periodic_bounce_v2.py'
      - '.github/workflows/experiment03-finiteT-periodic-bounce-v2.yml'

jobs:
  bounce:
    strategy:
      fail-fast: false
      matrix:
        delta: ['0.180','0.190','0.200','0.210']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python finiteT_nonlocal_periodic_bounce_v2.py --delta ${{ matrix.delta }} --nbasis 48 --ngrid 6144
