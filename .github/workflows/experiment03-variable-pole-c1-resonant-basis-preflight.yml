name: Experiment 03 variable-pole C1 resonant basis preflight

on:
  push:
    paths:
      - '.github/workflows/experiment03-variable-pole-c1-resonant-basis-preflight.yml'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/variable_pole_c1_resonant_basis_preflight.py'
  workflow_dispatch:

jobs:
  resonant-basis-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run metastable-window unrestricted basis preflight
        run: python variable_pole_c1_resonant_basis_preflight.py --kmax 128 --xmax 4.2 --ngrid 2600 --left-states 12 --json variable_pole_c1_resonant_basis_preflight.json
      - name: Upload resonant basis preflight metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment03-variable-pole-c1-resonant-basis-preflight
          path: experiments/03-superconducting-photon-flux-transduction/calculations/variable_pole_c1_resonant_basis_preflight.json
          if-no-files-found: warn
          retention-days: 90
