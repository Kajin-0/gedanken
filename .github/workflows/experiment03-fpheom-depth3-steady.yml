name: Experiment 03 FP-HEOM depth3 stationary oracle

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/heom_fp_harmonic_steady_only.py'
      - '.github/workflows/experiment03-fpheom-depth3-steady.yml'
  workflow_dispatch:

jobs:
  steady:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python heom_fp_harmonic_steady_only.py
