name: Experiment 03 delta212 capture certification

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/delta212_capture_certification.py'
      - '.github/workflows/experiment03-delta212-certification.yml'
  workflow_dispatch:

jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        area: ['470','475','480','485','490']
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python delta212_capture_certification.py --area ${{ matrix.area }}
