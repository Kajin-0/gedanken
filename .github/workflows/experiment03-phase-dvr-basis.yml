name: Experiment 03 phase DVR basis benchmark

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/phase_dvr_basis_convergence.py'
      - '.github/workflows/experiment03-phase-dvr-basis.yml'
  workflow_dispatch:

jobs:
  dvr:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        delta: ['0.21200', '0.21250', '0.21300']
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python phase_dvr_basis_convergence.py --delta ${{ matrix.delta }}
