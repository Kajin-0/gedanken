name: Experiment 03 nonlinear HEOM rightmost spectrum

on:
  push:
    branches: [main]
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/heom_nonlinear_rightmost_spectrum.py'
      - '.github/workflows/experiment03-heom-nonlinear-rightmost-spectrum.yml'
  workflow_dispatch:

jobs:
  spectrum:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [dim8_p4d5, dim10_p4d5]
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python heom_nonlinear_rightmost_spectrum.py --case '${{ matrix.case }}'
