name: Experiment 03 persist low-R dark results

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/persist_lowR_dark_results.py'
      - '.github/workflows/experiment03-persist-lowR-dark.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Recompute and persist selected results
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python persist_lowR_dark_results.py
      - name: Commit persisted snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/03-superconducting-photon-flux-transduction/RESULTS_LOW_R_DARK_2026-08-15.md
          git diff --cached --quiet || git commit -m "Persist Experiment 03 low-R and dark results"
          git push
