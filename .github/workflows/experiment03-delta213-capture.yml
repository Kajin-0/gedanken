name: Experiment 03 delta213 crossover-independent capture

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/crossover_independent_delta213_capture.py'
      - '.github/workflows/experiment03-delta213-capture.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python crossover_independent_delta213_capture.py
