name: Experiment 02 passive-cut regression

on:
  push:
    paths:
      - 'experiments/02-passive-gravitational-throughput/**'
      - '.github/workflows/experiment02-passive-cut.yml'
  pull_request:
    paths:
      - 'experiments/02-passive-gravitational-throughput/**'
      - '.github/workflows/experiment02-passive-cut.yml'

jobs:
  passive-cut:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/02-passive-gravitational-throughput/numerics/requirements.txt

      - name: Install pinned dependencies
        working-directory: experiments/02-passive-gravitational-throughput/numerics
        run: python -m pip install -r requirements.txt

      - name: Verify finite-dimensional passive selected-port cut
        working-directory: experiments/02-passive-gravitational-throughput/numerics
        run: python verify_passive_selected_port_cut.py
