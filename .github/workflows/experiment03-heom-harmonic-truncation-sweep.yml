name: Experiment 03 harmonic HEOM truncation sweep

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/heom_harmonic_truncation_sweep.py'
      - '.github/workflows/experiment03-heom-harmonic-truncation-sweep.yml'
  workflow_dispatch:

jobs:
  truncation:
    strategy:
      fail-fast: false
      matrix:
        case: [n8d4, n16d2, n16d3]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python heom_harmonic_truncation_sweep.py --case ${{ matrix.case }}
