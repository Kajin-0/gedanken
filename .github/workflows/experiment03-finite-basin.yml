name: Experiment 03 finite-time basin boundary

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/finite_time_basin_slice.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/finite_time_basin_validation.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/finite_time_basin_topology.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/full_dynamic_rfsquid.py'
      - '.github/workflows/experiment03-finite-basin.yml'
  pull_request:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/finite_time_basin_slice.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/finite_time_basin_validation.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/finite_time_basin_topology.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/full_dynamic_rfsquid.py'
      - '.github/workflows/experiment03-finite-basin.yml'

jobs:
  finite-basin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt

      - name: Install pinned dependencies
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt

      - name: Validate full-resolution pulled-back basin section
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python finite_time_basin_validation.py

      - name: Trace all local basin edges on the physical initial section
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python finite_time_basin_topology.py
