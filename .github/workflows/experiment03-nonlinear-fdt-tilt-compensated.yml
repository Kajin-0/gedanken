name: Experiment 03 nonlinear FDT compensated tilt

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/nonlinear_fdt_tilt_compensated.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/nonlinear_fdt_twa_screen.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/tilt_directionality_pareto.py'
      - '.github/workflows/experiment03-nonlinear-fdt-tilt-compensated.yml'

jobs:
  tilt:
    strategy:
      fail-fast: false
      matrix:
        delta: ['0.050','0.060','0.070','0.075']
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Run dark-compensated nonlinear tilt scan
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python nonlinear_fdt_tilt_compensated.py --delta ${{ matrix.delta }} --ntraj 512 --dt-ps 0.5 --seed 97531
