name: Experiment 03 FP-HEOM harmonic oracle

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/heom_fp_harmonic_oracle.py'
      - '.github/workflows/experiment03-fpheom-harmonic-oracle.yml'
  workflow_dispatch:

jobs:
  fp-oracle:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case:
          - fp_dim8_p4d1
          - fp_dim8_p4d2
          - fp_dim8_p4d3
          - fp_dim12_p4d2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python heom_fp_harmonic_oracle.py --case '${{ matrix.case }}'
