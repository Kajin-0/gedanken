name: Build V7 submission package

on:
  push:
    paths:
      - 'experiments/01-causal-quantum-branch-information/manuscript_v7/**'
      - '.github/workflows/submission-package.yml'
  pull_request:
    paths:
      - 'experiments/01-causal-quantum-branch-information/manuscript_v7/**'
      - '.github/workflows/submission-package.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-science texlive-bibtex-extra

      - name: Copy manifest-defined submission source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/experiments/01-causal-quantum-branch-information/manuscript_v7"
          OUT="$RUNNER_TEMP/gedanken-v7-submission"
          mkdir -p "$OUT"

          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            mkdir -p "$OUT/$(dirname "$rel")"
            cp "$ROOT/$rel" "$OUT/$rel"
          done < "$ROOT/SUBMISSION_MANIFEST.txt"

          cp "$ROOT/SUBMISSION_MANIFEST.txt" "$OUT/SUBMISSION_MANIFEST.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_COMMIT.txt"

      - name: Semantic submission guards
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/gedanken-v7-submission"

          if grep -R -n -F '\nu f_q' "$OUT" --include='*.tex'; then
            echo 'Found accidental nu f_q mechanical-coordinate typo.'
            exit 1
          fi

          if grep -R -n -E -i 'first ever|for the first time|unprecedented' "$OUT" --include='*.tex'; then
            echo 'Found disallowed priority-language phrase.'
            exit 1
          fi

          grep -q 'Data Availability' "$OUT/sections/06_discussion_conclusion.tex"
          grep -q 'GedankenRepo2026' "$OUT/data.bib"

      - name: Compile isolated submission source
        working-directory: ${{ runner.temp }}/gedanken-v7-submission
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Check unresolved references
        working-directory: ${{ runner.temp }}/gedanken-v7-submission
        run: |
          if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations" main.log; then
            echo 'Unresolved LaTeX references or citations found.'
            exit 1
          fi

      - name: Create clean source archive
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gedanken-v7-submission"
          rm -f main.aux main.bbl main.blg main.fdb_latexmk main.fls main.log main.out main.pdf
          python -m zipfile -c "$RUNNER_TEMP/gedanken-v7-source.zip" .

      - name: Upload clean source archive
        uses: actions/upload-artifact@v4
        with:
          name: gedanken-v7-submission-source
          path: ${{ runner.temp }}/gedanken-v7-source.zip
          if-no-files-found: error
