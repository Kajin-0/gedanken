name: Experiment 03 persist CPR response tolerance

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/persist_cpr_relaxation_tolerance.py'
      - '.github/workflows/experiment03-persist-cpr-relaxation.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Recompute and persist CPR-response tolerance
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python persist_cpr_relaxation_tolerance.py
      - name: Commit tolerance snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/03-superconducting-photon-flux-transduction/RESULTS_CPR_RELAXATION_TOLERANCE_2026-08-15.md
          git diff --cached --quiet || git commit -m "Persist Experiment 03 CPR-response tolerance"
          git push
