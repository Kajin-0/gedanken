name: Experiment 02 infinite-modal regression

on:
  push:
    paths:
      - 'experiments/02-passive-gravitational-throughput/**'
      - '.github/workflows/experiment02-infinite-modal.yml'
  pull_request:
    paths:
      - 'experiments/02-passive-gravitational-throughput/**'
      - '.github/workflows/experiment02-infinite-modal.yml'

jobs:
  infinite-modal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/02-passive-gravitational-throughput/numerics/requirements.txt

      - name: Install pinned dependencies
        working-directory: experiments/02-passive-gravitational-throughput/numerics
        run: python -m pip install -r requirements.txt

      - name: Stress-test bounded-port infinite-modal truncations
        working-directory: experiments/02-passive-gravitational-throughput/numerics
        run: python verify_infinite_modal_truncations.py
