name: Experiment 03 nonlinear HEOM stationary zero mode

on:
  push:
    branches: [main]
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/heom_nonlinear_steady_nullspace_probe.py'
      - '.github/workflows/experiment03-heom-nonlinear-steady-nullspace.yml'
  workflow_dispatch:

jobs:
  steady-zero-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case:
          - dim8_p4d5_control
          - dim8_p4d7_test
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python heom_nonlinear_steady_nullspace_probe.py --case '${{ matrix.case }}'
