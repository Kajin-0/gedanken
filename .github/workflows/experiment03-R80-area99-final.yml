name: Experiment 03 R80 final area99 bracket

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/R80_area99_final_bracket.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/nonlinear_fdt_twa_screen.py'
      - '.github/workflows/experiment03-R80-area99-final.yml'

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python R80_area99_final_bracket.py
