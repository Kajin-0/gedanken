name: Experiment 03 dim2 HEOM stationary reference

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/heom_dim2_stationary_reference.py'
      - '.github/workflows/experiment03-heom-dim2-stationary-reference.yml'
  workflow_dispatch:

jobs:
  reference:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case: [p4d4, p4d5, p4d6, p4d7, p4d8, p4d9, p5d6, p5d7, p5d8]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python heom_dim2_stationary_reference.py --case '${{ matrix.case }}'
