name: Experiment 03 one-loop boundary capture

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/one_loop_rate_boundary_capture.py'
      - '.github/workflows/experiment03-one-loop-boundary-capture.yml'
  workflow_dispatch:

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        delta: ['0.2110','0.2120']
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python one_loop_rate_boundary_capture.py --delta ${{ matrix.delta }}
