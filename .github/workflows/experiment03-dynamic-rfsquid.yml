name: Experiment 03 dynamic RCSJ regression

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/**'
      - '.github/workflows/experiment03-dynamic-rfsquid.yml'
  pull_request:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/**'
      - '.github/workflows/experiment03-dynamic-rfsquid.yml'

jobs:
  dynamic-rfsquid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt

      - name: Install pinned dependencies
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt

      - name: Run full nonlinear CPR-RCSJ smoke regression
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python full_dynamic_rfsquid.py --quick

      - name: Run sudden-quench threshold regression
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python quench_energy_bound.py --quick

      - name: Run dark-capture elimination regression
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python eliminated_dark_capture_closure.py

      - name: Run exact scalar-R damping regression
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python rcsj_damping_window.py

      - name: Run local fold-ghost sensitivity regression
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python dynamic_fold_ghost.py
