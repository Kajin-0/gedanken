name: Experiment 03 TEMPO dim2 combined convergence

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/tempo_dim2_combined_convergence.py'
      - '.github/workflows/experiment03-tempo-dim2-combined.yml'
  workflow_dispatch:

jobs:
  combined:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [d200, d100]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python -m pip install oqupy==0.5.0
      - run: python tempo_dim2_combined_convergence.py --case '${{ matrix.case }}'
