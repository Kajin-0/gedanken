name: Experiment 03 low-tilt nonlocal bounce continuation

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/tilt_nonlocal_continuation.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/R80_dissipative_bounce_screen.py'
      - '.github/workflows/experiment03-low-tilt-nonlocal-bounce.yml'

jobs:
  bounce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python tilt_nonlocal_continuation.py
