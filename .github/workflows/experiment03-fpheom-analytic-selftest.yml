name: Experiment 03 FP-HEOM analytic self-test

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/heom_fp_pure_dephasing_selftest.py'
      - '.github/workflows/experiment03-fpheom-analytic-selftest.yml'
  workflow_dispatch:

jobs:
  analytic-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python heom_fp_pure_dephasing_selftest.py
