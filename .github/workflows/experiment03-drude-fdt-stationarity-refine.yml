name: Experiment 03 Drude FDT stationarity convergence

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/drude_fdt_stationarity_refine.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/drude_fdt_stationarity.py'
      - '.github/workflows/experiment03-drude-fdt-stationarity-refine.yml'

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python drude_fdt_stationarity_refine.py
