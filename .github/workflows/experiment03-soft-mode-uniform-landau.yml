name: Experiment 03 soft-mode uniform Landau validation

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/soft_mode_uniform_landau.py'
      - '.github/workflows/experiment03-soft-mode-uniform-landau.yml'
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        delta: ['0.212','0.213']
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python soft_mode_uniform_landau.py --delta ${{ matrix.delta }}
