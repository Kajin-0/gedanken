name: Experiment 03 harmonic dim12 Schur oracle

on:
  push:
    branches: [main]
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/heom_harmonic_dim12_schur_oracle.py'
      - '.github/workflows/experiment03-heom-harmonic-dim12-schur-oracle.yml'
  workflow_dispatch:

jobs:
  schur-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python heom_harmonic_dim12_schur_oracle.py
