name: Experiment 03 geometry-aware quantum basin integral

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/quantum_basin_integral.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/quantum_initial_capture.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/finite_time_basin_slice.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/full_dynamic_rfsquid.py'
      - '.github/workflows/experiment03-quantum-basin-integral.yml'

jobs:
  basin-integral:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt

      - name: Install pinned dependencies
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt

      - name: Integrate Wigner mass through resolved basin strips
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python quantum_basin_integral.py --max-order-x 7 --zmax 5.5 --nscan 65
