name: Experiment 03 nonlinear FDT TWA

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/nonlinear_fdt_twa_screen.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/causal_two_pole_environment.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/history_fdt_reformation_margin.py'
      - '.github/workflows/experiment03-nonlinear-fdt-twa.yml'

jobs:
  nonlinear-twa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Run nonlinear causal-FDT TWA screen
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python nonlinear_fdt_twa_screen.py --ntraj 256 --dt-ps 0.5
