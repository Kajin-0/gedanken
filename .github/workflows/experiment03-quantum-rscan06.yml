name: Experiment 03 rDelta 0.6 probability damping scan
on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/quantum_capture_rscan06.py'
      - '.github/workflows/experiment03-quantum-rscan06.yml'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python quantum_capture_rscan06.py
