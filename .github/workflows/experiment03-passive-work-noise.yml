name: Experiment 03 passive work-noise metric

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/passive_work_noise_metric.py'
      - '.github/workflows/experiment03-passive-work-noise.yml'
  workflow_dispatch:

jobs:
  metric:
    strategy:
      fail-fast: false
      matrix:
        delta: ['0.21200','0.21250','0.21300']
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python passive_work_noise_metric.py --delta ${{ matrix.delta }} --area 500
