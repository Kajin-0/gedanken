name: Experiment 03 joint two-pole capture scout

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/two_pole_joint_capture_scout.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/two_pole_joint_covariance.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/causal_two_pole_environment.py'
      - '.github/workflows/experiment03-two-pole-joint-capture.yml'

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Run joint four-dimensional capture scout
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python two_pole_joint_capture_scout.py
