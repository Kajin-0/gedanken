name: Experiment 03 CPR response tolerance

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/cpr_relaxation_tolerance.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/nonlinear_fdt_twa_screen.py'
      - '.github/workflows/experiment03-cpr-relaxation.yml'

jobs:
  cpr-lag:
    strategy:
      fail-fast: false
      matrix:
        dt_ps: ['0.50','0.25']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Run finite CPR-response tolerance
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python cpr_relaxation_tolerance.py --ntraj 1024 --dt-ps ${{ matrix.dt_ps }} --seed 454545
