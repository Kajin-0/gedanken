name: Experiment 03 TEMPO dim2 fast memory discriminator

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/tempo_vs_heom_dim2_fast_memory.py'
      - '.github/workflows/experiment03-tempo-heom-dim2-fast-memory.yml'
  workflow_dispatch:

jobs:
  fast-memory:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [f8, f20]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python -m pip install oqupy==0.5.0
      - run: python tempo_vs_heom_dim2_fast_memory.py --case '${{ matrix.case }}'
