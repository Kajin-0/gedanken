name: Experiment 03 one-loop rate constrained capture

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/one_loop_rate_constrained_capture.py'
      - '.github/workflows/experiment03-one-loop-rate-capture.yml'

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        delta: ['0.2000','0.2050','0.2075','0.2100']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python one_loop_rate_constrained_capture.py --delta ${{ matrix.delta }}
