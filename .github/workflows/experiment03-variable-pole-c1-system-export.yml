name: Experiment 03 variable-pole C1 system export

on:
  push:
    paths:
      - '.github/workflows/experiment03-variable-pole-c1-system-export.yml'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/variable_pole_c1_system_export.py'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python variable_pole_c1_system_export.py --npz variable_pole_c1_system.npz --json variable_pole_c1_system.json
      - uses: actions/upload-artifact@v4
        with:
          name: experiment03-variable-pole-c1-system
          path: |
            experiments/03-superconducting-photon-flux-transduction/calculations/variable_pole_c1_system.npz
            experiments/03-superconducting-photon-flux-transduction/calculations/variable_pole_c1_system.json
          retention-days: 90
