name: Experiment 03 alpha robustness

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/tangent_alpha_robustness.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/initial_quantum_tangent_scan.py'
      - '.github/workflows/experiment03-alpha-robustness.yml'

jobs:
  alpha-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Run causal-cutoff robustness scan
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python tangent_alpha_robustness.py
