name: Experiment 02 throughput regressions

on:
  push:
    branches:
      - experiment-02-passive-gravitational-throughput
    paths:
      - 'experiments/02-passive-gravitational-throughput/**'
      - '.github/workflows/experiment02-throughput.yml'
  workflow_dispatch:

jobs:
  throughput:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy

      - name: Verify two-port spectral bound
        run: python experiments/02-passive-gravitational-throughput/numerics/verify_two_port_bound.py

      - name: Verify passive-network cut-set bound
        run: python experiments/02-passive-gravitational-throughput/numerics/verify_passive_network_cutset.py

      - name: Verify TT quadrupole propagation bound
        run: python experiments/02-passive-gravitational-throughput/numerics/verify_tt_propagation_bound.py
