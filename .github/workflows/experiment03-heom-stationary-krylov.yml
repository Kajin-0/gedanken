name: Experiment 03 HEOM stationary Krylov validation

on:
  push:
    branches: [main]
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/heom_stationary_krylov_probe.py'
      - '.github/workflows/experiment03-heom-stationary-krylov.yml'
  workflow_dispatch:

jobs:
  krylov-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python heom_stationary_krylov_probe.py --case nonlinear_dim8_p4d5_control
