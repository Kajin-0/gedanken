name: Experiment 03 crossover rate matching

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/crossover_rate_matching.py'
      - '.github/workflows/experiment03-crossover-rate-matching.yml'
  workflow_dispatch:

jobs:
  match:
    strategy:
      fail-fast: false
      matrix:
        delta: ['0.212','0.213','0.214','0.215']
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python crossover_rate_matching.py --delta ${{ matrix.delta }}
