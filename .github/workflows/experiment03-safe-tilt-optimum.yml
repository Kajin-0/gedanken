name: Experiment 03 narrow safe-tilt optimum

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/safe_tilt_optimum_worker.py'
      - '.github/workflows/experiment03-safe-tilt-optimum.yml'
  workflow_dispatch:

jobs:
  optimize:
    strategy:
      fail-fast: false
      matrix:
        delta: ['0.21225','0.21250','0.21275']
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python safe_tilt_optimum_worker.py --delta ${{ matrix.delta }}
