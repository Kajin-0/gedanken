name: Experiment 03 candidate dissipation partition

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/candidate_dissipation_partition.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/causal_energetic_lock.py'
      - '.github/workflows/experiment03-dissipation-partition.yml'

jobs:
  partition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Partition deterministic resistor dissipation
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python candidate_dissipation_partition.py
