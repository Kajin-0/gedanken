name: Experiment 03 capture-corridor holdout

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/capture_corridor_holdout.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/stage_selectivity_stress.py'
      - '.github/workflows/experiment03-capture-corridor-holdout.yml'

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python capture_corridor_holdout.py
