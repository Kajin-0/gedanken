name: Experiment 03 uniform crossover residue

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/uniform_crossover_residue_test.py'
      - '.github/workflows/experiment03-uniform-residue.yml'
  workflow_dispatch:

jobs:
  residue:
    strategy:
      fail-fast: false
      matrix:
        delta: ['0.212','0.213','0.214']
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python uniform_crossover_residue_test.py --delta ${{ matrix.delta }}
