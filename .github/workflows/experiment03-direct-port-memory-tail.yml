name: Experiment 03 direct-port memory-tail audit

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/direct_port_memory_tail_audit.py'
      - '.github/workflows/experiment03-direct-port-memory-tail.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python direct_port_memory_tail_audit.py
