name: Experiment 03 TEMPO-HEOM dim2 transient timestep refinement

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/tempo_vs_heom_dim2_transient_dt.py'
      - '.github/workflows/experiment03-tempo-heom-dim2-transient-dt.yml'
  workflow_dispatch:

jobs:
  transient-dt:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [d200, d100, d050]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python -m pip install oqupy==0.5.0
      - run: python tempo_vs_heom_dim2_transient_dt.py --case '${{ matrix.case }}'
