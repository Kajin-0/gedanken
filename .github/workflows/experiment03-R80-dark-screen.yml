name: Experiment 03 R80 dark-stability screen

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/R80_dark_stability_screen.py'
      - '.github/workflows/experiment03-R80-dark-screen.yml'

jobs:
  dark-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python R80_dark_stability_screen.py
