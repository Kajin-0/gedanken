name: Experiment 03 directional recovery barriers

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/directional_recovery_barriers.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/causal_two_pole_environment.py'
      - '.github/workflows/experiment03-directional-recovery.yml'

jobs:
  barriers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Run directional recovery diagnostic
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python directional_recovery_barriers.py
