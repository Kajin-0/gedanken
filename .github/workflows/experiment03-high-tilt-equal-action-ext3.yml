name: Experiment 03 high-tilt equal-action extension 3

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/high_tilt_equal_action_capture_ext3.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/nonlinear_fdt_twa_screen.py'
      - '.github/workflows/experiment03-high-tilt-equal-action-ext3.yml'

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        delta: ['0.090','0.100','0.110']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python high_tilt_equal_action_capture_ext3.py --delta ${{ matrix.delta }}
