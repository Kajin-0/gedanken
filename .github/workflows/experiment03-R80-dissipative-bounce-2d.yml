name: Experiment 03 R80 two-parameter dissipative bounce

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/R80_dissipative_bounce_2d.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/R80_dissipative_bounce_screen.py'
      - '.github/workflows/experiment03-R80-dissipative-bounce-2d.yml'

jobs:
  bounce2d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python R80_dissipative_bounce_2d.py
