name: Experiment 03 finite-T determinant UV-tail correction

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/finiteT_determinant_uv_tail.py'
      - '.github/workflows/experiment03-finiteT-determinant-uv-tail.yml'

jobs:
  determinant:
    strategy:
      fail-fast: false
      matrix:
        delta: ['0.180','0.200','0.210']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python finiteT_determinant_uv_tail.py --delta ${{ matrix.delta }}
