name: Experiment 03 extended high-tilt finite-T dark diagnostic

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/high_tilt_finiteT_dark_screen_ext.py'
      - '.github/workflows/experiment03-high-tilt-finiteT-dark-ext.yml'

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python high_tilt_finiteT_dark_screen_ext.py
