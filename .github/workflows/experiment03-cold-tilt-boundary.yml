name: Experiment 03 cold tilt metastability boundary

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/cold_tilt_metastability_boundary.py'
      - '.github/workflows/experiment03-cold-tilt-boundary.yml'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python cold_tilt_metastability_boundary.py
