name: Experiment 03 harmonic Schur-terminator HEOM probe

on:
  push:
    branches: [main]
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/heom_schur_terminator_harmonic_probe.py'
      - '.github/workflows/experiment03-heom-schur-harmonic-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - name: Run depth-four Schur probe
        run: |
          python - <<'PY'
          import heom_schur_terminator_harmonic_probe as m
          m.CASES['p4d4'] = dict(dim=8, npade=4, depth=4)
          m.run_case('p4d4')
          PY
