name: Experiment 03 harmonic squeezed-basis audit

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/harmonic_squeezed_basis_audit.py'
      - '.github/workflows/experiment03-harmonic-squeezed-basis-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python harmonic_squeezed_basis_audit.py
