name: Experiment 03 energetic lock

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/causal_energetic_lock.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/causal_two_pole_environment.py'
      - '.github/workflows/experiment03-energetic-lock.yml'

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements.txt
      - working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python -m pip install -r requirements.txt
      - name: Run causal energetic-lock diagnostic
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
        run: python causal_energetic_lock.py
