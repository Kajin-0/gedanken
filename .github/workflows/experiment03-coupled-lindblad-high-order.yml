name: Experiment 03 coupled-Lindblad p12 p16 acceptance

on:
  push:
    paths:
      - '.github/workflows/experiment03-coupled-lindblad-high-order.yml'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/coupled_lindblad_pade_high_order.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/run_coupled_lindblad_pade_sdp.py'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/coupled_lindblad_pade_sdp.py'
  workflow_dispatch:

jobs:
  high-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-heom.txt
      - run: python -m pip install -q 'cvxpy>=1.6,<2'
      - name: Run p8 p12 p16 high-order bath acceptance
        run: python coupled_lindblad_pade_high_order.py
