name: Experiment 03 physical Lorentzian continuum scaling

on:
  push:
    paths:
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/physical_lorentzian_continuum_scaling.py'
      - '.github/workflows/experiment03-physical-lorentzian-continuum.yml'
  workflow_dispatch:

jobs:
  scaling:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/03-superconducting-photon-flux-transduction/calculations/requirements-heom.txt
      - run: python -m pip install -r requirements-heom.txt
      - run: python physical_lorentzian_continuum_scaling.py
