name: Experiment 03 variable-pole C1 harmonic solver export

on:
  push:
    paths:
      - '.github/workflows/experiment03-variable-pole-c1-harmonic-solver-export.yml'
      - 'experiments/03-superconducting-photon-flux-transduction/calculations/variable_pole_c1_harmonic_solver_export.py'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: experiments/03-superconducting-photon-flux-transduction/calculations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-heom.txt
      - name: Install pinned CPU PyTorch
        run: python -m pip install -q torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -q 'cvxpy>=1.6,<2'
      - name: Export accepted rank16 bath and independent FDT target
        run: python variable_pole_c1_harmonic_solver_export.py
      - uses: actions/upload-artifact@v4
        with:
          name: experiment03-variable-pole-c1-harmonic-input
          path: experiments/03-superconducting-photon-flux-transduction/calculations/variable_pole_c1_harmonic_input
          retention-days: 90
